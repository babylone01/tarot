<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- Remplacé par --base-href à la compilation (jeu publié dans /jouer/). -->
  <base href="/jouer/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tarot Gothique 2026 – Jeu de tarot en ligne gratuit dans le navigateur</title>
  <meta name="description" content="Jouez à Tarot Gothique 2026 directement dans votre navigateur : jeu de tarot gratuit, jeu de cartes en ligne à 3, 4 ou 5 joueurs ou en solo contre l’IA. Sans installation.">
  <link rel="canonical" href="https://tarot-gothique-2026.com/jouer/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Tarot Gothique 2026 – Jeu de tarot en ligne gratuit">
  <meta property="og:description" content="Jeu de tarot gratuit dans le navigateur : en ligne à 3, 4 ou 5 joueurs ou en solo contre l’IA.">
  <meta property="og:url" content="https://tarot-gothique-2026.com/jouer/">
  <meta property="og:image" content="https://tarot-gothique-2026.com/jeux-de-tarot.jpg">

  <!-- Barres du navigateur mobile assorties au jeu (et non blanches). -->
  <meta name="theme-color" content="#0b0b0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tarot Gothique">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon1.png"/>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Fond sombre partout : plus de bandes blanches pendant le chargement ni autour du jeu. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0b0f; }
    #chargement { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0b0b0f; color: #d4af37; font-family: Georgia, 'Times New Roman', serif; text-align: center; z-index: 10;
      transition: opacity .4s; }
    #chargement h1 { margin: 0 16px 12px; font-size: clamp(1.6rem, 7vw, 2.6rem); letter-spacing: .06em; }
    #chargement p { margin: 0; color: #e2e8f0; font-family: system-ui, sans-serif; font-size: .95rem; opacity: .8; }
    #chargement .barre { width: min(60vw, 240px); height: 3px; margin-top: 18px; background: #2a2a35; border-radius: 2px; overflow: hidden; }
    #chargement .barre i { display: block; width: 40%; height: 100%; background: #d4af37; animation: va 1.2s ease-in-out infinite; }
    @keyframes va { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="chargement" aria-live="polite">
    <h1>Tarot Gothique 2026</h1>
    <p>Jeu de tarot · chargement…</p>
    <div class="barre"><i></i></div>
  </div>
  <script>
    (function () {
      // Préchargement (16/11) : vidéo de départ, musique et images de l'accueil téléchargées dès
      // l'ouverture de la page, pendant que le moteur du jeu démarre. Le jeu les retrouve ensuite
      // dans le cache du navigateur : plus de vidéo qui hoquette ni de musique qui saccade.
      // Même forme d'adresse que le moteur Flutter (encodeURI = Uri.encodeFull).
      (function () {
        if (!window.fetch) return;
        var base = 'assets/assets/';
        var urgent = ['reaper_3d/depart.mp4'];
        var ensuite = ['sounds/slice.mp3', 'images/menu_bg.jpg',
          'images/cards/21 de Atout.png', "images/cards/L'Excuse.png", 'images/cards/1 de Atout.png',
          'images/cards/Roi de Coeur.png', 'images/cards/Dame de Pique.png', 'images/cards/Cavalier de Carreau.png'];
        ['hors_ligne', 'en_ligne'].forEach(function (c) {
          ['aucun', '3', '4', '5'].forEach(function (n) { ensuite.push('accueil3d/moitie_' + c + '_' + n + '.png'); });
        });
        function charger(liste, priorite) {
          return Promise.all(liste.map(function (f) {
            return fetch(encodeURI(base + f), { priority: priorite }).then(function (r) { return r.ok ? r.blob() : null; }).catch(function () {});
          }));
        }
        charger(urgent, 'high').then(function () { return charger(ensuite, 'low'); });
      })();
      // Écran de chargement retiré à la première image du jeu.
      window.addEventListener('flutter-first-frame', function () {
        var c = document.getElementById('chargement');
        if (!c) return;
        c.style.opacity = '0';
        setTimeout(function () { c.remove(); }, 450);
      });
      // Table de jeu (appel du jeu) : paysage verrouillé si le navigateur l'accepte (plein écran
      // exigé, Chrome Android) ; sinon le jeu affiche « Tournez votre téléphone ».
      window.tarotTactile = function () {
        return !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
      };
      window.tarotPaysage = function (paysage) {
        try {
          var o = screen.orientation;
          if (!o) return;
          if (!paysage) { if (o.unlock) o.unlock(); return; }
          var d = document.documentElement;
          var plein = document.fullscreenElement ? Promise.resolve()
            : (d.requestFullscreen ? d.requestFullscreen({ navigationUI: 'hide' }) : Promise.reject());
          plein.then(function () { return o.lock ? o.lock('landscape') : null; }).catch(function () {});
        } catch (e) {}
      };
      // Plein écran (barres du navigateur masquées, comme F11) au premier geste du joueur : les
      // navigateurs refusent tout plein écran sans clic, toucher ou touche du clavier.
      // Téléphone et tablette : redemandé à chaque toucher (le verrouillage paysage de la table
      // l'exige). Ordinateur : une seule fois, pour que Échap reste respecté.
      var tactile = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
      var demande = false;
      function pleinEcran(e) {
        if (e && e.type === 'keydown' && (e.key === 'Escape' || e.key === 'F11')) return;
        if (!tactile && demande) return;
        var d = document.documentElement;
        if (document.fullscreenElement || !d.requestFullscreen) return;
        demande = true;
        d.requestFullscreen({ navigationUI: 'hide' }).catch(function () { demande = false; });
      }
      document.addEventListener('pointerup', pleinEcran, true);
      document.addEventListener('touchend', pleinEcran, true);
      document.addEventListener('keydown', pleinEcran, true);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
