<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie Photo - Jeu de Tarot Gothique 2026</title>
    <meta name="description" content="Découvrez en images l'univers graphique de notre jeu de tarot. Captures d'écran, design gothique et illustrations.">
    <link rel="canonical" href="https://babylone01.github.io/tarot/galerie.html">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>">

    <style>
        :root {
            --primary-gold: #d4af37;
            --bg-black: #0b0b0f;
            --card-bg: #161622;
            --header-bg: #12121a;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --border-color: #27273a;
        }

        .goog-te-banner-frame,
        .goog-te-banner-frame.skiptranslate,
        #goog-gt-tt,
        .goog-te-balloon-frame,
        .goog-te-spinner-pos,
        .VIpgJd-yD32fd-Aca33b,
        iframe.skiptranslate,
        iframe[id*=":1.container"],
        iframe[id*=":2.container"] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            height: 0 !important;
            width: 0 !important;
            pointer-events: none !important;
        }

        body { top: 0px !important; position: static !important; }

        html, body {
            height: 100vh;
            max-height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-black);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        header {
            background-color: var(--header-bg);
            padding: 0.5rem 1rem;
            text-align: center;
            border-bottom: 2px solid var(--primary-gold);
            flex-shrink: 0;
        }
        h1 {
            color: var(--primary-gold);
            margin: 0 0 0.2rem 0;
            font-size: 1.3rem;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }
        .main-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.2rem;
            flex-wrap: wrap;
        }
        .main-nav a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
            transition: color 0.2s;
        }
        .main-nav a:hover, .main-nav a.active {
            color: var(--primary-gold);
            text-decoration: underline;
        }

        .custom-lang-container {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: var(--card-bg);
            border: 1px solid var(--primary-gold);
            border-radius: 6px;
            padding: 2px 8px;
            margin-left: 0.5rem;
        }
        .lang-earth-icon {
            width: 18px;
            height: 18px;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            flex-shrink: 0;
        }
        .custom-lang-select {
            background: transparent;
            color: var(--text-main);
            border: none;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            font-family: inherit;
        }
        .custom-lang-select option {
            background-color: var(--card-bg);
            color: var(--text-main);
        }

        #google_translate_element {
            display: none !important;
        }

        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 0.6rem 1rem;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            overflow: hidden;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 0.8rem;
            flex: 1;
            min-height: 0;
        }
        .gallery-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .gallery-img {
            width: 100%;
            height: calc(100% - 24px);
            object-fit: cover;
            background-color: #000;
            display: block;
        }
        .gallery-caption {
            padding: 0.2rem 0.5rem;
            color: var(--text-muted);
            font-size: 0.75rem;
            text-align: center;
            background-color: var(--card-bg);
            height: 24px;
            line-height: 20px;
            box-sizing: border-box;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        footer {
            background-color: var(--header-bg);
            text-align: center;
            padding: 0.4rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        footer a { color: var(--primary-gold); text-decoration: none; }

        @media (max-width: 900px) {
            html, body { overflow: auto; height: auto; }
            .gallery-grid { grid-template-columns: 1fr; grid-template-rows: auto; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Galerie Visuelle du Jeu de Tarot Gothique</h1>
        <nav class="main-nav">
            <a href="index.html">Accueil / Jeu</a>
            <a href="regles.html">Règles du Tarot</a>
            <a href="galerie.html" class="active">Galerie Photo</a>
            <a href="apropos.html">À propos & FAQ</a>
            
            <div class="custom-lang-container">
                <img src="terre.jpeg" alt="Langue" class="lang-earth-icon">
                <select id="languageSelect" class="custom-lang-select" onchange="changeLanguage(this.value)">
                    <option value="fr">Français</option>
                    <option value="en">English</option>
                    <option value="de">Deutsch</option>
                    <option value="es">Español</option>
                    <option value="it">Italiano</option>
                    <option value="pt">Português</option>
                    <option value="ru">Русский</option>
                    <option value="ja">日本語</option>
                </select>
            </div>
        </nav>
    </header>

    <div id="google_translate_element"></div>

    <main>
        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="jeu-de-tarot.jpg" alt="Ambiance Jeu de Tarot" class="gallery-img">
                <div class="gallery-caption">Ambiance visuelle et plateau de jeu</div>
            </div>
            <div class="gallery-item">
                <img src="banner.jpg" alt="Plateau de jeu gothique" class="gallery-img">
                <div class="gallery-caption">Design des cartes gothiques uniques</div>
            </div>
            <div class="gallery-item">
                <img src="banner.jpg" alt="Menu du jeu de tarot" class="gallery-img">
                <div class="gallery-caption">Interface multijoueur & solo</div>
            </div>
            <div class="gallery-item">
                <img src="jeu-de-tarot.jpg" alt="Règles et plis du jeu" class="gallery-img">
                <div class="gallery-caption">Calcul automatique des plis & score</div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 <strong>Tarot Gothique</strong> - Galerie photo | <a href="index.html">Retour à l'accueil</a></p>
    </footer>

    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'fr',
          includedLanguages: 'fr,en,de,es,it,pt,ru,ja',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false
        }, 'google_translate_element');
      }

      function changeLanguage(langCode) {
        var selectObj = document.querySelector('.goog-te-combo');
        if (selectObj) {
            selectObj.value = langCode;
            selectObj.dispatchEvent(new Event('change'));
        } else {
            document.cookie = "googtrans=/fr/" + langCode + "; path=/;";
            document.cookie = "googtrans=/fr/" + langCode + "; domain=" + window.location.hostname + "; path=/;";
            location.reload();
        }
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
