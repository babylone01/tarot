<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique – Tarot Gothique</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0b0b0f">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <style>
        :root { --gold: #f3d060; --card: rgba(22, 22, 34, 0.82); --text: #f8fafc; --muted: #e2e8f0; --border: #d4af37; }
        html, body { margin: 0; min-height: 100vh; color: var(--text); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(rgba(11, 11, 15, 0.55), rgba(11, 11, 15, 0.75)), url('/background.jpg') center / cover fixed #0b0b0f; }
        body { display: flex; align-items: center; justify-content: center; padding: 1rem; box-sizing: border-box; }
        .carte { max-width: 560px; width: 100%; text-align: center; background: var(--card); backdrop-filter: blur(10px);
            border: 1px solid var(--border); border-radius: 10px; padding: 2rem 1.5rem; box-shadow: 0 0 24px rgba(212, 175, 55, 0.35); }
        .code { font-size: 4.5rem; font-weight: 800; color: var(--gold); margin: 0; letter-spacing: 4px; text-shadow: 0 0 18px rgba(212, 175, 55, 0.7); }
        h1 { font-size: 1.4rem; margin: 0.4rem 0 0.2rem; }
        .en { color: var(--muted); font-style: italic; margin: 0 0 1rem; }
        p { color: var(--muted); line-height: 1.5; }
        .liens a { display: inline-block; margin: 0.3rem; padding: 0.55rem 1.1rem; border-radius: 8px; text-decoration: none; font-weight: bold;
            border: 1px solid var(--gold); color: var(--gold); }
        .liens a.principal { background: var(--gold); color: #0b0b0f; }
        .langues { margin-top: 1.2rem; font-size: 0.85rem; }
        .langues a { color: var(--gold); margin: 0 0.25rem; text-decoration: none; }
            .langues img.drapeau { width: 20px; height: 15px; vertical-align: -2px; border-radius: 2px; margin-right: 2px; }
        .langues a { display: inline-block; margin: 0.2rem 0.3rem; }
    </style>
</head>
<body>
    <main class="carte">
        <p class="code" id="icone">✓</p>
        <h1 id="titre">Merci pour votre achat !</h1>
        <p id="texte">Votre paiement est confirmé. Vos jetons ou votre article sont crédités sur votre compte de jeu et apparaissent dans quelques secondes, sur toutes vos plateformes.</p>
        <p id="pc">Sur PC, revenez simplement dans la fenêtre du jeu.</p>
        <nav class="liens">
            <a class="principal" id="jouer" href="/jouer/">Retour au jeu</a>
        </nav>
    </main>
    <script>
    (function () {
        var q = new URLSearchParams(location.search);
        var annule = q.get('annule') === '1';
        var en = (q.get('l') || 'fr') !== 'fr';
        var t = annule
            ? (en ? ['×', 'Payment cancelled', 'No charge was made. You can go back to the game and try again whenever you like.', 'On PC, simply return to the game window.', 'Back to the game']
                  : ['×', 'Paiement annulé', 'Aucun montant n’a été débité. Vous pouvez revenir au jeu et réessayer quand vous le souhaitez.', 'Sur PC, revenez simplement dans la fenêtre du jeu.', 'Retour au jeu'])
            : (en ? ['✓', 'Thank you for your purchase!', 'Your payment is confirmed. Your chips or item are credited to your game account and will appear within a few seconds, on all your platforms.', 'On PC, simply return to the game window.', 'Back to the game']
                  : null);
        if (en) document.documentElement.lang = 'en';
        if (t) {
            ['icone', 'titre', 'texte', 'pc', 'jouer'].forEach(function (id, i) { document.getElementById(id).textContent = t[i]; });
        }
    })();
    </script>
</body>
</html>
