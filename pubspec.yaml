name: tarot_app
description: "Projet Tarot Gothique - Table Triangle Carré Pentagone"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Animations
  cupertino_icons: ^2.0.0
  provider: ^6.1.5+1
  animations: ^3.0.0

  # Supabase (Auth & Realtime)
  supabase_flutter: ^2.15.4
  crypto: ^3.0.7

  # Impression & PDF (Rapport de scores)
  pdf: ^3.10.7
  printing: ^5.11.1

  # Audio (Faucheuse 3D)
  audioplayers: ^6.8.1

  # Lecteur vidéo (Faucheuse 3D Splash)
  video_player: ^2.9.2

  # Gestion des permissions système (Caméra, Micro, Stockage)
  permission_handler: ^13.0.2

  # Géolocalisation & Partage (Tarot Social)
  geolocator: ^14.1.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Asset bundles
  assets:
    - assets/images/table_tapis.png
    - assets/images/menu_bg.png
    - assets/images/card_back_dark.png
    - assets/images/cards/
    - assets/reaper_3d/
    - assets/sounds/

  # Typographies
  fonts:
    - family: Almendra
      fonts:
        - asset: assets/fonts/Almendra-Regular.ttf
        - asset: assets/fonts/Almendra-Bold.ttf
          weight: 700
        - asset: assets/fonts/Almendra-Italic.ttf
          style: italic

# Surcharges de dépendances transitives
dependency_overrides:
  archive: ^4.2.0
  material_color_utilities: ^0.13.1
  qr: ^4.0.0
